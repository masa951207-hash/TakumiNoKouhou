name: Build WebGL → Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages デプロイに必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイを1つに制限（古いデプロイをキャンセルしない）
concurrency:
  group: pages
  cancel-in-progress: false

env:
  UNITY_PROJECT_PATH: .
  BUILD_METHOD: TakumiNoKouhou.Editor.WebGLBuilder.Build
  BUILD_OUTPUT: Builds/WebGL/TakumiNoKouhou

jobs:
  # ─────────────────────────────────────────────────
  # Job 1: Unity WebGL ビルド
  # ─────────────────────────────────────────────────
  build:
    name: Build WebGL
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Git LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: git-lfs-${{ runner.os }}-${{ hashFiles('.gitattributes') }}

      # Library キャッシュで再ビルド時間を短縮
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      # GameCI で Unity WebGL ビルド
      - name: Build with Unity (WebGL)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:   ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          unityVersion:   auto
          buildMethod:    ${{ env.BUILD_METHOD }}
          buildName:      TakumiNoKouhou
          buildsPath:     Builds

      # GitHub Pages 用アーティファクトとしてアップロード
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_OUTPUT }}

  # ─────────────────────────────────────────────────
  # Job 2: GitHub Pages へデプロイ
  # ─────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
